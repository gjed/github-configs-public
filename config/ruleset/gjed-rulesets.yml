
# Main branch protection for OSS with maintainer bypass
# Allows repository maintainers and admins to bypass branch protection
# Suitable for open source projects where maintainers need flexibility
gjed-oss-main:
  target: branch
  enforcement: active
  bypass_actors:
    - actor_type: RepositoryRole
      actor_id: 2  # Maintain role
      bypass_mode: always
    - actor_type: RepositoryRole
      actor_id: 5  # Admin role
      bypass_mode: always
  conditions:
    ref_name:
      include:
        - "~DEFAULT_BRANCH"
      exclude: []
  rules:
    - type: deletion
    - type: non_fast_forward
    - type: required_linear_history
    - type: required_signatures

# Same as gjed-oss-main, plus a bypass for the gjed-release GitHub App.
# Only for gjed/gjed, whose metrics workflow pushes an unsigned commit with the
# metrics SVGs straight to main every day. Assigned through the
# oss-gjed-release-bypass group, never alongside gjed-oss-main: rulesets stack,
# so a bypass here does not skip gjed-oss-main.
gjed-oss-main-gjed-release-bypass:
  target: branch
  enforcement: active
  bypass_actors:
    - actor_type: RepositoryRole
      actor_id: 2  # Maintain role
      bypass_mode: always
    - actor_type: RepositoryRole
      actor_id: 5  # Admin role
      bypass_mode: always
    - actor_type: Integration
      actor_id: 5566709  # gjed-release GitHub App
      bypass_mode: always
  conditions:
    ref_name:
      include:
        - "~DEFAULT_BRANCH"
      exclude: []
  rules:
    - type: deletion
    - type: non_fast_forward
    - type: required_linear_history
    - type: required_signatures

# Pull-request review requirement, split out from gjed-oss-main so it can be
# assigned independently. Assigned per repository (not to the oss group) where
# outside collaborators have write access: they must open a pull request and
# get one code-owner approval, while maintainers and admins can bypass.
# The gjed-renovate GitHub App can bypass on pull requests only, so it can
# merge its own dependency updates; it cannot push to the branch directly.
gjed-oss-review:
  target: branch
  enforcement: active
  bypass_actors:
    - actor_type: RepositoryRole
      actor_id: 2  # Maintain role
      bypass_mode: always
    - actor_type: RepositoryRole
      actor_id: 5  # Admin role
      bypass_mode: always
    - actor_type: Integration
      actor_id: 5592240  # gjed-renovate GitHub App
      bypass_mode: pull_request
  conditions:
    ref_name:
      include:
        - "~DEFAULT_BRANCH"
      exclude: []
  rules:
    - type: pull_request
      parameters:
        required_approving_review_count: 1
        dismiss_stale_reviews_on_push: true
        require_code_owner_review: true
        require_last_push_approval: false

# CI gates for terraform-github-config-as-yaml. The contexts are the job ids
# in that repository's .github/workflows/ci.yml; renaming a job there strands
# every open pull request on the old name. integration_id pins each check to
# the GitHub Actions app so a commit status with the same name cannot satisfy it.
terraform-github-config-as-yaml-ci:
  target: branch
  enforcement: active
  bypass_actors:
    - actor_type: RepositoryRole
      actor_id: 2  # Maintain role
      bypass_mode: always
    - actor_type: RepositoryRole
      actor_id: 5  # Admin role
      bypass_mode: always
  conditions:
    ref_name:
      include:
        - "~DEFAULT_BRANCH"
      exclude: []
  rules:
    - type: required_status_checks
      parameters:
        strict_required_status_checks_policy: false
        required_checks:
          - context: pre-commit
            integration_id: 15368  # GitHub Actions
          - context: pytest
            integration_id: 15368
          - context: terraform-test
            integration_id: 15368

# Release tags are created only by the release workflow. A pushed v* tag is
# picked up by the Terraform Registry and published to every consumer, so
# write collaborators must not be able to create, move or delete one.
# Bypass: admins, and the gjed-release GitHub App, whose token the release
# workflow hands to semantic-release. The built-in GitHub Actions app cannot
# be a bypass actor on a personal account, so GITHUB_TOKEN is not enough.
gjed-release-tags:
  target: tag
  enforcement: active
  bypass_actors:
    - actor_type: RepositoryRole
      actor_id: 5  # Admin role
      bypass_mode: always
    - actor_type: Integration
      actor_id: 5566709  # gjed-release GitHub App
      bypass_mode: always
  conditions:
    ref_name:
      include:
        - "refs/tags/v*"
      exclude: []
  rules:
    - type: creation
    - type: update
    - type: deletion
